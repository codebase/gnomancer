name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pyflakes gnomancer tests examples
      - run: pytest -q -m "not slow"
      - name: demo report (no haplogroup tools)
        run: |
          python examples/make_demo.py /tmp/demo
          gnomancer /tmp/demo/demo_AncestryDNA.txt --out /tmp/demo_out --no-y --no-mt --no-clinvar --no-pharmcat
          test -s /tmp/demo_out/REPORT.html
      - name: whole-genome demo report (VCF only, no downloads)
        run: |
          python examples/make_wgs_demo.py /tmp/wgs.vcf.gz --snvs 2600000
          gnomancer /tmp/wgs.vcf.gz --out /tmp/wgs_out --no-setup --no-y --no-mt --no-clinvar --no-pharmcat --no-ancestry
          grep -q "Genome analysis report" /tmp/wgs_out/REPORT.md
          grep -q "e3/e4" /tmp/wgs_out/REPORT.md
