name = "gnomancer-site"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "gnomancer.com", custom_domain = true },
  { pattern = "www.gnomancer.com", custom_domain = true },
]

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true
